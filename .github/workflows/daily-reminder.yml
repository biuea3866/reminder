name: Daily Study Reminder

on:
  schedule:
    # 월/수/금 오전 9시 KST (= UTC 00:00)
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch: # 수동 실행도 가능

jobs:
  generate-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml anthropic google-genai

      - name: Debug secrets availability
        run: |
          echo "GEMINI_API_KEY length: ${#GEMINI_API_KEY}"
          echo "ANTHROPIC_API_KEY length: ${#ANTHROPIC_API_KEY}"
          echo "NOTION_TOKEN length: ${#NOTION_TOKEN}"
          echo "NOTION_PARENT_PAGE_ID length: ${#NOTION_PARENT_PAGE_ID}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}

      - name: Run reminder script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: python scripts/generate_reminder.py
